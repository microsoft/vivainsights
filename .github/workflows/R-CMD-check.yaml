# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on: [push, pull_request]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - os: macos-latest
            r: release
            check_args: c("--no-manual", "--as-cran")
            build_args: c("--no-manual", "--compact-vignettes=gs+qpdf")
          - os: windows-latest
            r: release
            check_args: c("--no-manual", "--as-cran")
            build_args: c("--no-manual", "--compact-vignettes=gs+qpdf")
          - os: ubuntu-latest
            r: devel
            http_user_agent: release
            check_args: c("--no-manual", "--as-cran")
            build_args: c("--no-manual", "--compact-vignettes=gs+qpdf")
          - os: ubuntu-latest
            r: release
            check_args: c("--as-cran")
            build_args: c("--compact-vignettes=gs+qpdf")
            build_manual: true
          - os: ubuntu-latest
            r: oldrel-1
            check_args: c("--no-manual", "--as-cran")
            build_args: c("--no-manual", "--compact-vignettes=gs+qpdf")

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http_user_agent }}

      - uses: r-lib/actions/setup-tinytex@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        if: matrix.config.build_manual

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          args: ${{ matrix.config.check_args }}
          build_args: ${{ matrix.config.build_args }}
          error-on: '"warning"'
          upload-results: true
          upload-snapshots: true
