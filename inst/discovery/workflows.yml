    r_function: network_g2g
    input_grain: Group-to-group query
    required_columns: []
    privacy: Confirm source query groups meet disclosure requirements.
    returns: plot or igraph object
    example: network_g2g(g2g_data)
    documentation: https://microsoft.github.io/vivainsights/reference/network_g2g.html
    related: [network_p2p, network_summary]
    python_function: network_g2g
    parity: partial

  - id: anonymize-data
    task: Anonymize identifiers and HR attributes
    intents:
      - anonymize employee data
      - remove identifying information
      - prepare sample data safely
    r_function: anonymise
    input_grain: Viva Insights query
    required_columns: []
    privacy: Anonymization reduces direct identifiers but does not replace disclosure review.
    returns: anonymized data frame
    example: anonymise(pq_data)
    documentation: https://microsoft.github.io/vivainsights/reference/anonymise.html
    related: [anonymize, jitter_metrics, identify_privacythreshold]
    python_function: null
    parity: r_only

  - id: generate-report
    task: Generate a reusable analysis report
    intents:
      - create an HTML report
      - generate a wellbeing report
      - automate analysis output
    r_function: generate_report
    input_grain: Person query
    required_columns: [PersonId]
    privacy: Review the generated report and its grouping thresholds before distribution.
    returns: rendered report files
    example: generate_report(title = "Viva Insights report", filename = "report", outputs = output_list, titles = title_list, subheaders = rep("", length(output_list)), echos = rep(FALSE, length(output_list)), levels = rep(2, length(output_list)))
    documentation: https://microsoft.github.io/vivainsights/reference/generate_report.html
